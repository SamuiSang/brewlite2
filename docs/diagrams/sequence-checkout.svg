  <text x="625" y="864" class="msg-label">Cập nhật Payment=FAILED, Order=CANCELLED &amp; Hoàn kho Ingredient()</text>
  <line x1="499.5" y1="898" x2="270.5" y2="898" class="msg-dashed"/>
  <text x="385" y="892" class="msg-label">8b. Báo giao dịch thất bại / Hủy đơn &amp; Hoàn trả tồn kho()</text>
  <line x1="259.5" y1="918" x2="65" y2="918" class="msg-dashed"/>
  <text x="162.25" y="912" class="msg-label">Hiển thị kết quả đơn hàng cho Khách hàng</text>

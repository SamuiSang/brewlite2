<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 980" width="1060" height="980" style="background-color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.3"/>
    </marker>
    <style>
      .title { font-size: 14.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .part-box { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
      .part-text { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-label { font-size: 12px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .lifeline { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .act-bar { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .frag-box { fill: none; stroke: #000000; stroke-width: 1.2; }
      .frag-tag { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .frag-type { font-size: 10.5px; font-weight: 700; fill: #000000; }
      .frag-cond { font-size: 10.5px; font-style: italic; fill: #000000; }
      .frag-div { stroke: #000000; stroke-width: 1.1; stroke-dasharray: 4,3; }
      .msg-solid { fill: none; stroke: #000000; stroke-width: 1.25; marker-end: url(#arrow-solid); }
      .msg-dashed { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5,3; marker-end: url(#arrow-open); }
      .msg-label { font-size: 10.8px; fill: #000000; text-anchor: middle; }
      .msg-self-label { font-size: 10.8px; fill: #000000; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

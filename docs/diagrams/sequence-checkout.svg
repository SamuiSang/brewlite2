<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 685" width="980" height="685" style="background-color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.3"/>
    </marker>
    <style>
      .title { font-size: 13.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .part-box { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
      .part-text { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-label { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .lifeline { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .act-bar { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .frag-box { fill: none; stroke: #000000; stroke-width: 1.2; }
      .frag-tag { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .frag-type { font-size: 10.5px; font-weight: 700; fill: #000000; }
      .frag-cond { font-size: 10px; font-style: italic; fill: #000000; }
      .frag-div { stroke: #000000; stroke-width: 1.1; stroke-dasharray: 4,3; }
      .msg-solid { fill: none; stroke: #000000; stroke-width: 1.25; marker-end: url(#arrow-solid); }
      .msg-dashed { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5,3; marker-end: url(#arrow-open); }
      .msg-label { font-size: 10.2px; fill: #000000; text-anchor: middle; }
      .msg-self-label { font-size: 10px; fill: #000000; text-anchor: start; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="490" y="26" class="title">SƠ ĐỒ TUẦN TỰ TRỌNG TÂM: ĐẶT ĐƠN HÀNG &amp; THANH TOÁN (8 BƯỚC)</text>

  <!-- 5 Lifelines -->
  <circle cx="60" cy="52" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="61" x2="60" y2="83" stroke="#000000" stroke-width="1.5"/>
  <line x1="47" y1="69" x2="73" y2="69" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="83" x2="50" y2="98" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="83" x2="70" y2="98" stroke="#000000" stroke-width="1.5"/>
  <text x="60" y="114" class="actor-label">Khách hàng</text>
  <line x1="60" y1="122" x2="60" y2="672" class="lifeline"/>

  <rect x="165" y="54" width="140" height="44" class="part-box"/>
  <text x="235" y="72" class="part-text">«giao diện»</text>
  <text x="235" y="88" class="part-text">:Màn hình Web</text>
  <line x1="235" y1="98" x2="235" y2="672" class="lifeline"/>

  <rect x="390" y="54" width="170" height="44" class="part-box"/>
  <text x="475" y="72" class="part-text">«điều khiển»</text>
  <text x="475" y="88" class="part-text">:Hệ thống Xử lý</text>
  <line x1="475" y1="98" x2="475" y2="672" class="lifeline"/>

  <rect x="640" y="54" width="150" height="44" class="part-box"/>
  <text x="715" y="72" class="part-text">«thực thể»</text>
  <text x="715" y="88" class="part-text">:Cơ sở dữ liệu</text>
  <line x1="715" y1="98" x2="715" y2="672" class="lifeline"/>

  <rect x="820" y="54" width="145" height="44" class="part-box"/>
  <text x="892.5" y="72" class="part-text">«hệ thống ngoài»</text>
  <text x="892.5" y="88" class="part-text">:Cổng Thanh toán</text>
  <line x1="892.5" y1="98" x2="892.5" y2="672" class="lifeline"/>

  <!-- Phần 1: Đặt đơn & Khóa kho -->
  <rect x="229.5" y="144" width="11" height="190" class="act-bar"/>
  <rect x="469.5" y="162" width="11" height="170" class="act-bar"/>
  <rect x="709.5" y="180" width="11" height="16" class="act-bar"/>
  <rect x="709.5" y="230" width="11" height="16" class="act-bar"/>

  <line x1="60" y1="148" x2="229.5" y2="148" class="msg-solid"/>
  <text x="145" y="142" class="msg-label">1. Bấm đặt hàng</text>
  <line x1="240.5" y1="166" x2="469.5" y2="166" class="msg-solid"/>
  <text x="355" y="160" class="msg-label">Gửi đơn (kèm đăng nhập)</text>
  <line x1="480.5" y1="184" x2="709.5" y2="184" class="msg-solid"/>
  <text x="595" y="178" class="msg-label">2. Lấy giá gốc &amp; định mức</text>

  <path d="M 480.5 202 L 516 202 L 516 218 L 480.5 218" class="msg-solid"/>
  <text x="523" y="213" class="msg-self-label">3. Tính lại tổng tiền ở máy chủ</text>

  <line x1="480.5" y1="236" x2="709.5" y2="236" class="msg-solid"/>
  <text x="595" y="230" class="msg-label">Khóa &amp; trừ kho (theo phiên bản)</text>

  <rect x="32" y="248" width="768" height="86" class="frag-box"/>
  <polygon points="32,248 74,248 74,258 66,266 32,266" class="frag-tag"/>
  <text x="40" y="261" class="frag-type">alt</text>
  <text x="84" y="261" class="frag-cond">[Hết nguyên liệu / đụng độ]</text>
  <line x1="469.5" y1="276" x2="240.5" y2="276" class="msg-dashed"/>
  <text x="355" y="270" class="msg-label">Hủy giao dịch (Lỗi 409)</text>
  <line x1="229.5" y1="290" x2="60" y2="290" class="msg-dashed"/>
  <text x="145" y="284" class="msg-label">Báo hết hàng</text>

  <line x1="32" y1="298" x2="800" y2="298" class="frag-div"/>
  <text x="44" y="310" class="frag-cond">[Đủ nguyên liệu]</text>
  <rect x="709.5" y="312" width="11" height="14" class="act-bar"/>
  <line x1="480.5" y1="316" x2="709.5" y2="316" class="msg-solid"/>
  <text x="595" y="310" class="msg-label">4. Lưu đơn chờ (15 phút)</text>
  <line x1="469.5" y1="328" x2="240.5" y2="328" class="msg-dashed"/>
  <text x="355" y="322" class="msg-label">Sang trang thanh toán</text>

  <!-- Phần 2: Thanh toán 2 bước -->
  <rect x="229.5" y="354" width="11" height="306" class="act-bar"/>
  <rect x="469.5" y="372" width="11" height="284" class="act-bar"/>
  <rect x="709.5" y="390" width="11" height="14" class="act-bar"/>

  <line x1="60" y1="358" x2="229.5" y2="358" class="msg-solid"/>
  <text x="145" y="352" class="msg-label">5. Chọn cổng &amp; bấm thanh toán</text>
  <line x1="240.5" y1="376" x2="469.5" y2="376" class="msg-solid"/>
  <text x="355" y="370" class="msg-label">Thanh toán (kèm mã chống trùng)</text>
  <line x1="480.5" y1="394" x2="709.5" y2="394" class="msg-solid"/>
  <text x="595" y="388" class="msg-label">6. Kiểm tra mã chống trùng</text>

  <rect x="32" y="408" width="936" height="260" class="frag-box"/>
  <polygon points="32,408 74,408 74,418 66,426 32,426" class="frag-tag"/>
  <text x="40" y="421" class="frag-type">alt</text>
  <text x="84" y="421" class="frag-cond">[Mã đã có (Bấm đúp / Lag)]</text>
  <line x1="469.5" y1="436" x2="240.5" y2="436" class="msg-dashed"/>
  <text x="355" y="430" class="msg-label">Trả kết quả cũ (Không trừ 2 lần)</text>
  <line x1="229.5" y1="450" x2="60" y2="450" class="msg-dashed"/>
  <text x="145" y="444" class="msg-label">Hiện trạng thái hiện tại</text>

  <line x1="32" y1="458" x2="968" y2="458" class="frag-div"/>
  <text x="44" y="470" class="frag-cond">[Giao dịch mới]</text>
  <rect x="887" y="476" width="11" height="58" class="act-bar"/>
  <line x1="480.5" y1="480" x2="887" y2="480" class="msg-solid"/>
  <text x="684" y="474" class="msg-label">7. Lưu chờ &amp; Tạo mã QR thanh toán</text>
  <line x1="887" y1="498" x2="240.5" y2="498" class="msg-dashed"/>
  <text x="564" y="492" class="msg-label">Hiện giao diện / Mã QR</text>
  <line x1="60" y1="514" x2="887" y2="514" class="msg-solid"/>
  <text x="474" y="508" class="msg-label">Quét QR xác nhận</text>
  <line x1="887" y1="530" x2="480.5" y2="530" class="msg-solid"/>
  <text x="684" y="524" class="msg-label">8. Gửi kết quả (kèm chữ ký bảo mật)</text>

  <rect x="42" y="540" width="916" height="122" class="frag-box"/>
  <polygon points="42,540 84,540 84,550 76,558 42,558" class="frag-tag"/>
  <text x="50" y="553" class="frag-type">alt</text>
  <text x="94" y="553" class="frag-cond">[Thành công &amp; đúng chữ ký]</text>
  <rect x="709.5" y="564" width="11" height="14" class="act-bar"/>
  <line x1="480.5" y1="568" x2="709.5" y2="568" class="msg-solid"/>
  <text x="595" y="562" class="msg-label">Đổi Đã thanh toán &amp; Cộng điểm</text>
  <line x1="469.5" y1="584" x2="240.5" y2="584" class="msg-dashed"/>
  <text x="355" y="578" class="msg-label">Thành công → Mở biên nhận</text>
  <line x1="229.5" y1="598" x2="60" y2="598" class="msg-dashed"/>
  <text x="145" y="592" class="msg-label">Hiện biên nhận đơn hàng</text>

  <line x1="42" y1="606" x2="958" y2="606" class="frag-div"/>
  <text x="54" y="618" class="frag-cond">[Lỗi hoặc quá hạn 15 phút]</text>
  <rect x="709.5" y="622" width="11" height="14" class="act-bar"/>
  <line x1="480.5" y1="626" x2="709.5" y2="626" class="msg-solid"/>
  <text x="595" y="620" class="msg-label">Hủy đơn &amp; Hoàn trả tồn kho</text>
  <line x1="469.5" y1="642" x2="240.5" y2="642" class="msg-dashed"/>
  <text x="355" y="636" class="msg-label">Báo thất bại / đã hủy</text>
  <line x1="229.5" y1="656" x2="60" y2="656" class="msg-dashed"/>
  <text x="145" y="650" class="msg-label">Cho chọn phương thức khác</text>
</svg>

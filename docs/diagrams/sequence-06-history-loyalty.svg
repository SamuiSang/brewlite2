<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" width="940" height="650" style="background-color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.3"/>
    </marker>
    <style>
      .title { font-size: 13.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .part-box { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
      .part-text { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-label { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .lifeline { stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .act-bar { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .frag-box { fill: none; stroke: #000000; stroke-width: 1.2; }
      .frag-tag { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .frag-type { font-size: 10.5px; font-weight: 700; fill: #000000; }
      .frag-cond { font-size: 10px; font-style: italic; fill: #000000; }
      .frag-div { stroke: #000000; stroke-width: 1.1; stroke-dasharray: 4,3; }
      .msg-solid { fill: none; stroke: #000000; stroke-width: 1.25; marker-end: url(#arrow-solid); }
      .msg-dashed { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5,3; marker-end: url(#arrow-open); }
      .msg-label { font-size: 10.2px; fill: #000000; text-anchor: middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="470" y="26" class="title">SƠ ĐỒ TUẦN TỰ: BIÊN NHẬN, LỊCH SỬ ĐƠN, TRẠNG THÁI &amp; ĐIỂM THƯỞNG (8 BƯỚC)</text>

  <!-- 5 Lifelines -->
  <circle cx="62" cy="52" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="62" y1="61" x2="62" y2="83" stroke="#000000" stroke-width="1.5"/>
  <line x1="49" y1="69" x2="75" y2="69" stroke="#000000" stroke-width="1.5"/>
  <line x1="62" y1="83" x2="52" y2="98" stroke="#000000" stroke-width="1.5"/>
  <line x1="62" y1="83" x2="72" y2="98" stroke="#000000" stroke-width="1.5"/>
  <text x="62" y="114" class="actor-label">Khách hàng</text>
  <line x1="62" y1="122" x2="62" y2="638" class="lifeline"/>

  <circle cx="182" cy="52" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="182" y1="61" x2="182" y2="83" stroke="#000000" stroke-width="1.5"/>
  <line x1="169" y1="69" x2="195" y2="69" stroke="#000000" stroke-width="1.5"/>
  <line x1="182" y1="83" x2="172" y2="98" stroke="#000000" stroke-width="1.5"/>
  <line x1="182" y1="83" x2="192" y2="98" stroke="#000000" stroke-width="1.5"/>
  <text x="182" y="114" class="actor-label">Nhân viên Quầy</text>
  <line x1="182" y1="122" x2="182" y2="638" class="lifeline"/>

  <rect x="270" y="54" width="150" height="44" class="part-box"/>
  <text x="345" y="72" class="part-text">«giao diện»</text>
  <text x="345" y="88" class="part-text">:Màn hình Web</text>
  <line x1="345" y1="98" x2="345" y2="638" class="lifeline"/>

  <rect x="510" y="54" width="170" height="44" class="part-box"/>
  <text x="595" y="72" class="part-text">«điều khiển»</text>
  <text x="595" y="88" class="part-text">:Hệ thống Xử lý</text>
  <line x1="595" y1="98" x2="595" y2="638" class="lifeline"/>

  <rect x="760" y="54" width="150" height="44" class="part-box"/>
  <text x="835" y="72" class="part-text">«thực thể»</text>
  <text x="835" y="88" class="part-text">:Cơ sở dữ liệu</text>
  <line x1="835" y1="98" x2="835" y2="638" class="lifeline"/>

  <!-- 1. Tự cộng điểm khi đơn vừa thanh toán -->
  <rect x="505" y="136" width="405" height="62" class="frag-box"/>
  <polygon points="505,136 547,136 547,146 539,154 505,154" class="frag-tag"/>
  <text x="513" y="149" class="frag-type">opt</text>
  <text x="557" y="149" class="frag-cond">[Đơn vừa thanh toán &amp; chưa từng cộng điểm]</text>
  <rect x="589.5" y="162" width="11" height="32" class="act-bar"/>
  <rect x="829.5" y="166" width="11" height="24" class="act-bar"/>
  <line x1="600.5" y1="172" x2="829.5" y2="172" class="msg-solid"/>
  <text x="715" y="166" class="msg-label">1. Cộng điểm (10k = +1đ) &amp; Lưu lịch sử</text>
  <line x1="829.5" y1="190" x2="600.5" y2="190" class="msg-dashed"/>
  <text x="715" y="184" class="msg-label">Đã cộng điểm</text>

  <!-- 2. Xem biên nhận / lịch sử & Chặn 403 -->
  <rect x="339.5" y="214" width="11" height="150" class="act-bar"/>
  <rect x="589.5" y="232" width="11" height="122" class="act-bar"/>
  <rect x="829.5" y="250" width="11" height="16" class="act-bar"/>
  <line x1="62" y1="218" x2="339.5" y2="218" class="msg-solid"/>
  <text x="200" y="212" class="msg-label">2. Mở biên nhận / lịch sử đơn</text>
  <line x1="350.5" y1="236" x2="589.5" y2="236" class="msg-solid"/>
  <text x="470" y="230" class="msg-label">Gửi yêu cầu xem (kèm đăng nhập)</text>
  <line x1="600.5" y1="254" x2="829.5" y2="254" class="msg-solid"/>
  <text x="715" y="248" class="msg-label">3. Lấy đơn (mới trước) &amp; điểm</text>

  <rect x="35" y="268" width="655" height="100" class="frag-box"/>
  <polygon points="35,268 77,268 77,278 69,286 35,286" class="frag-tag"/>
  <text x="43" y="281" class="frag-type">alt</text>
  <text x="87" y="281" class="frag-cond">[Không phải chủ đơn]</text>
  <line x1="589.5" y1="298" x2="350.5" y2="298" class="msg-dashed"/>
  <text x="470" y="292" class="msg-label">Từ chối truy cập (Lỗi 403)</text>
  <line x1="339.5" y1="314" x2="62" y2="314" class="msg-dashed"/>
  <text x="200" y="308" class="msg-label">Báo không có quyền xem</text>

  <line x1="35" y1="322" x2="690" y2="322" class="frag-div"/>
  <text x="47" y="334" class="frag-cond">[Đúng chủ đơn hoặc Quầy]</text>
  <line x1="589.5" y1="346" x2="350.5" y2="346" class="msg-dashed"/>
  <text x="470" y="340" class="msg-label">Trả biên nhận, lịch sử &amp; điểm</text>
  <line x1="339.5" y1="362" x2="62" y2="362" class="msg-dashed"/>
  <text x="200" y="356" class="msg-label">Hiện đơn &amp; thanh tiến trình</text>

  <!-- 3. Quầy cập nhật trạng thái -->
  <rect x="589.5" y="390" width="11" height="48" class="act-bar"/>
  <rect x="829.5" y="408" width="11" height="18" class="act-bar"/>
  <line x1="182" y1="394" x2="589.5" y2="394" class="msg-solid"/>
  <text x="385" y="388" class="msg-label">4. Đổi trạng thái (Đang pha → Hoàn tất)</text>
  <line x1="600.5" y1="414" x2="829.5" y2="414" class="msg-solid"/>
  <text x="715" y="408" class="msg-label">5. Lưu trạng thái &amp; Nhật ký</text>
  <line x1="589.5" y1="434" x2="182" y2="434" class="msg-dashed"/>
  <text x="385" y="428" class="msg-label">Xác nhận cập nhật</text>

  <!-- 4. Đổi điểm giảm giá -->
  <rect x="339.5" y="458" width="11" height="168" class="act-bar"/>
  <rect x="589.5" y="476" width="11" height="138" class="act-bar"/>
  <rect x="829.5" y="494" width="11" height="16" class="act-bar"/>
  <line x1="62" y1="462" x2="339.5" y2="462" class="msg-solid"/>
  <text x="200" y="456" class="msg-label">6. Nhập điểm muốn đổi (≥ 10đ)</text>
  <line x1="350.5" y1="480" x2="589.5" y2="480" class="msg-solid"/>
  <text x="470" y="474" class="msg-label">Gửi yêu cầu đổi điểm</text>
  <line x1="600.5" y1="498" x2="829.5" y2="498" class="msg-solid"/>
  <text x="715" y="492" class="msg-label">7. Kiểm tra số dư hiện có</text>

  <rect x="35" y="512" width="875" height="118" class="frag-box"/>
  <polygon points="35,512 77,512 77,522 69,530 35,530" class="frag-tag"/>
  <text x="43" y="525" class="frag-type">alt</text>
  <text x="87" y="525" class="frag-cond">[Không đủ số dư hoặc &lt; 10 điểm]</text>
  <line x1="589.5" y1="542" x2="350.5" y2="542" class="msg-dashed"/>
  <text x="470" y="536" class="msg-label">Từ chối (Lỗi 400 - Không âm điểm)</text>
  <line x1="339.5" y1="558" x2="62" y2="558" class="msg-dashed"/>
  <text x="200" y="552" class="msg-label">Báo không đủ điểm</text>

  <line x1="35" y1="566" x2="910" y2="566" class="frag-div"/>
  <text x="47" y="578" class="frag-cond">[Đủ điểm hợp lệ]</text>
  <rect x="829.5" y="586" width="11" height="16" class="act-bar"/>
  <line x1="600.5" y1="590" x2="829.5" y2="590" class="msg-solid"/>
  <text x="715" y="584" class="msg-label">8. Trừ điểm &amp; Lưu lịch sử đổi</text>
  <line x1="589.5" y1="606" x2="350.5" y2="606" class="msg-dashed"/>
  <text x="470" y="600" class="msg-label">Trả tiền giảm &amp; số dư mới</text>
  <line x1="339.5" y1="622" x2="62" y2="622" class="msg-dashed"/>
  <text x="200" y="616" class="msg-label">Cập nhật giá đã giảm</text>
</svg>

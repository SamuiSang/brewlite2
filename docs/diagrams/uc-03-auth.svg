<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="0 1, 11 6, 0 11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .boundary-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 8; ry: 8; }
      .boundary-title { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-title { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-sub { font-size: 10px; fill: #000000; text-anchor: middle; }
      .uc-ellipse { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
      .uc-title { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .uc-sub { font-size: 9.5px; fill: #000000; text-anchor: middle; }
      .assoc-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .inherit-line { stroke: #000000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-inherit); }
      .dep-line { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow-open); }
      .rel-tag-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; rx: 3; ry: 3; }
      .rel-label { font-size: 9.5px; font-style: italic; font-weight: 600; fill: #000000; text-anchor: middle; }
      .legend-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 5; ry: 5; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #000000; }
      .legend-text { font-size: 10px; fill: #000000; }
    </style>
  </defs>

  <!-- White Canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="560" y="28" class="title">UC-03 - Sơ đồ Use Case: Đăng ký, Đăng nhập, Hồ sơ &amp; Xác thực Phân quyền JWT (FR-04)</text>

  <!-- System Boundary -->
  <rect x="210" y="48" width="700" height="395" class="boundary-box"/>
  <text x="560" y="70" class="boundary-title">BrewLite - Phân hệ Xác thực, Quản lý Tài khoản &amp; Giám sát Hệ thống (FR-04)</text>

  <!-- Left Top Actor: Guest -->
  <g transform="translate(95, 155)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách vãng lai</text>
    <text x="0" y="86" class="actor-sub">(Guest Customer)</text>
  </g>

  <!-- Left Bottom Actor: Authenticated Customer -->
  <g transform="translate(95, 345)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách thành viên</text>
    <text x="0" y="86" class="actor-sub">(Authenticated Customer)</text>
  </g>

  <!-- Generalization: Customer inherits Guest -->
  <line x1="95" y1="305" x2="95" y2="252" class="inherit-line"/>

  <!-- Right Actor: Health Probe / CI-CD Monitor -->
  <g transform="translate(1020, 345)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Giám sát Hạ tầng / CI-CD</text>
    <text x="0" y="86" class="actor-sub">(Health Probe / Admin)</text>
  </g>

  <!-- Column 1 Use Cases (x = 385) -->
  <!-- UC-03.1: Register -->
  <g transform="translate(385, 125)">
    <ellipse cx="0" cy="0" rx="140" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03.1: Đăng ký tài khoản mới</text>
    <text x="0" y="11" class="uc-sub">(POST /api/v1/auth/register)</text>
  </g>

  <!-- UC-03.2: Login -->
  <g transform="translate(385, 225)">
    <ellipse cx="0" cy="0" rx="140" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03.2: Đăng nhập &amp; Nhận JWT</text>
    <text x="0" y="11" class="uc-sub">(POST /api/v1/auth/login)</text>
  </g>

  <!-- UC-03.3: View Profile -->
  <g transform="translate(385, 365)">
    <ellipse cx="0" cy="0" rx="140" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03.3: Xem hồ sơ &amp; Điểm tích lũy</text>
    <text x="0" y="11" class="uc-sub">(GET /api/v1/auth/me)</text>
  </g>

  <!-- Column 2 Use Cases (x = 745) -->
  <!-- UC-03.5: Bcrypt & Issue JWT (included by 03.1 and 03.2) -->
  <g transform="translate(745, 165)">
    <ellipse cx="0" cy="0" rx="140" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03.5: Xác thực Bcrypt &amp; Ký JWT</text>
    <text x="0" y="11" class="uc-sub">(Payload: sub, email, role | 24h)</text>
  </g>

  <!-- UC-03.4: Redirect Login from Checkout (extends 03.2) -->
  <g transform="translate(745, 265)">
    <ellipse cx="0" cy="0" rx="140" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03.4: Đăng nhập tiếp tục đơn</text>
    <text x="0" y="11" class="uc-sub">(?redirect=/checkout - Giữ giỏ hàng)</text>
  </g>

  <!-- UC-03.6: Health Check -->
  <g transform="translate(745, 365)">
    <ellipse cx="0" cy="0" rx="140" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03.6: Giám sát sức khỏe hệ thống</text>
    <text x="0" y="11" class="uc-sub">(GET /api/v1/health - SELECT 1)</text>
  </g>

  <!-- Solid Association Lines -->
  <line x1="125" y1="150" x2="245" y2="125" class="assoc-line"/>
  <line x1="125" y1="170" x2="245" y2="225" class="assoc-line"/>
  <line x1="125" y1="355" x2="245" y2="365" class="assoc-line"/>
  <line x1="885" y1="365" x2="990" y2="355" class="assoc-line"/>

  <!-- <<include>> & <<extend>> Relationships (Zero Crossing) -->
  <!-- UC-03.1 -> UC-03.5 (<<include>>) -->
  <line x1="525" y1="132" x2="610" y2="155" class="dep-line"/>
  <rect x="535" y="128" width="62" height="16" class="rel-tag-bg"/>
  <text x="566" y="139" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-03.2 -> UC-03.5 (<<include>>) -->
  <line x1="525" y1="215" x2="610" y2="178" class="dep-line"/>
  <rect x="535" y="185" width="62" height="16" class="rel-tag-bg"/>
  <text x="566" y="196" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-03.4 -> UC-03.2 (<<extend>>) -->
  <line x1="605" y1="258" x2="525" y2="235" class="dep-line"/>
  <rect x="535" y="242" width="62" height="16" class="rel-tag-bg"/>
  <text x="566" y="253" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- Legend Box -->
  <rect x="120" y="458" width="880" height="84" class="legend-box"/>
  <text x="138" y="476" class="legend-title">Ghi chú nghiệp vụ Chức năng 3 (Hiếu - Product Owner | Chuẩn đơn sắc đen-trắng phục vụ in ấn báo cáo LaTeX):</text>
  <text x="138" y="494" class="legend-text">• Mật khẩu người dùng bắt buộc băm một chiều bằng Bcrypt (saltRounds &gt;= 10) và đối chiếu qua bcrypt.compare().</text>
  <text x="138" y="511" class="legend-text">• Đăng nhập thành công cấp phát JWT Token (hạn 24h, payload: sub, email, role), tự động gắn Header Authorization: Bearer &lt;token&gt;.</text>
  <text x="138" y="528" class="legend-text">• Hỗ trợ ?redirect=/checkout bảo toàn giỏ hàng Zustand; GET /api/v1/health thực thi SELECT 1 kiểm tra kết nối PostgreSQL thực tế.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" width="1320" height="640" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="660" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">UC-04 - Đặt đơn hàng và Khóa tồn kho nguyên vật liệu theo công thức pha chế</text>

  <!-- System Boundary Box -->
  <rect x="270" y="55" width="1020" height="425" rx="8" ry="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="780" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e" letter-spacing="0.3">Hệ thống BrewLite – Chức năng 4 (FR-05): Đặt đơn hàng &amp; Khóa tồn kho nguyên vật liệu</text>

  <!-- Actor: Customer -->
  <g transform="translate(100, 210)">
    <!-- Actor Head -->
    <circle cx="35" cy="22" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <!-- Actor Body & Limbs -->
    <line x1="35" y1="38" x2="35" y2="78" stroke="#334155" stroke-width="2"/>
    <line x1="12" y1="52" x2="58" y2="52" stroke="#334155" stroke-width="2"/>
    <line x1="35" y1="78" x2="16" y2="108" stroke="#334155" stroke-width="2"/>
    <line x1="35" y1="78" x2="54" y2="108" stroke="#334155" stroke-width="2"/>
    <text x="35" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Khách hàng</text>
    <text x="35" y="142" text-anchor="middle" font-size="11" fill="#64748b">(Customer / Guest)</text>
  </g>

  <!-- Association: Customer to CreateOrder -->
  <line x1="175" y1="260" x2="330" y2="260" stroke="#334155" stroke-width="1.8"/>

  <!-- Main UseCase: UC-04 CreateOrder -->
  <g transform="translate(325, 205)" filter="url(#shadow)">
    <ellipse cx="170" cy="55" rx="165" ry="50" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="170" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">UC-04</text>
    <text x="170" y="56" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f766e">Đặt đơn hàng &amp; Khóa kho nguyên liệu</text>
    <line x1="45" y1="64" x2="295" y2="64" stroke="#99f6e4" stroke-width="1"/>
    <text x="170" y="80" text-anchor="middle" font-size="10.5" fill="#0d9488">Điểm mở rộng: Áp mã voucher, Ghi chú</text>
  </g>

  <!-- Included UseCases -->
  <!-- 1. Validate DTO -->
  <g transform="translate(930, 95)" filter="url(#shadow)">
    <ellipse cx="160" cy="30" rx="150" ry="26" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="160" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">Xác thực dữ liệu đầu vào</text>
    <text x="160" y="43" text-anchor="middle" font-size="11" fill="#0f766e">(DTO Validation)</text>
  </g>

  <!-- 2. Recalculate Price -->
  <g transform="translate(930, 175)" filter="url(#shadow)">
    <ellipse cx="160" cy="30" rx="150" ry="26" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="160" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">Tính toán lại 100% tổng tiền</text>
    <text x="160" y="43" text-anchor="middle" font-size="11" fill="#0f766e">(Business Layer Authoritative)</text>
  </g>

  <!-- 3. Lock Inventory (Ingredient & Recipe) -->
  <g transform="translate(910, 255)" filter="url(#shadow)">
    <ellipse cx="180" cy="34" rx="175" ry="30" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Đối soát công thức &amp; Khóa kho nguyên liệu</text>
    <text x="180" y="44" text-anchor="middle" font-size="11" fill="#115e59">(RecipeItem &amp; Ingredient Optimistic Lock)</text>
  </g>

  <!-- 4. Init Order -->
  <g transform="translate(930, 345)" filter="url(#shadow)">
    <ellipse cx="160" cy="30" rx="150" ry="26" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="160" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">Khởi tạo bản ghi đơn hàng</text>
    <text x="160" y="43" text-anchor="middle" font-size="11" fill="#0f766e">(Trạng thái PENDING &amp; OrderItem)</text>
  </g>

  <!-- Include dependency lines with labels -->
  <!-- To Validate DTO -->
  <path d="M 640 230 C 730 180, 830 145, 930 130" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="748" y="162" width="70" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="783" y="175" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">«include»</text>

  <!-- To Recalculate Price -->
  <path d="M 655 245 C 740 225, 830 215, 930 210" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="760" y="214" width="70" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="795" y="227" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">«include»</text>

  <!-- To Lock Inventory -->
  <path d="M 660 265 L 905 285" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="750" y="265" width="70" height="18" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="1"/>
  <text x="785" y="278" text-anchor="middle" font-size="10.5" fill="#0f766e" font-weight="700">«include»</text>

  <!-- To Init Order -->
  <path d="M 640 290 C 730 330, 830 355, 930 370" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="750" y="325" width="70" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="785" y="338" text-anchor="middle" font-size="10.5" fill="#475569" font-weight="600">«include»</text>

  <!-- Extended UseCases -->
  <!-- 1. Apply Voucher -->
  <g transform="translate(330, 105)" filter="url(#shadow)">
    <ellipse cx="140" cy="25" rx="130" ry="23" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
    <text x="140" y="29" text-anchor="middle" font-size="11.5" font-weight="600" fill="#134e4a">Áp dụng giảm giá từ Voucher</text>
  </g>
  <path d="M 470 128 L 485 200" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="492" y="148" width="68" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="526" y="161" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">«extend»</text>

  <!-- 2. Add Note -->
  <g transform="translate(330, 395)" filter="url(#shadow)">
    <ellipse cx="140" cy="25" rx="130" ry="23" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
    <text x="140" y="29" text-anchor="middle" font-size="11.5" font-weight="600" fill="#134e4a">Thêm ghi chú đơn hàng</text>
  </g>
  <path d="M 470 395 L 485 315" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="492" y="348" width="68" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="526" y="361" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">«extend»</text>

  <!-- Bottom Legend -->
  <g transform="translate(130, 495)">
    <rect x="0" y="0" width="1080" height="120" rx="8" ry="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="25" y="24" font-size="12.5" font-weight="700" fill="#0f172a">📌 Quy tắc nghiệp vụ &amp; Điểm cải tiến kiến trúc (Theo dặn dò mới của Giảng viên):</text>
    <text x="35" y="46" font-size="11.5" fill="#334155">• <tspan font-weight="600">Quản lý tồn kho theo Nguyên vật liệu (Ingredient):</tspan> Hệ thống F&amp;B không lưu tồn kho theo ly thành phẩm (Product.stock). Tồn kho được quản lý qua bảng <tspan font-weight="600" fill="#0f766e">Ingredient</tspan> (đơn vị: g, ml, cái).</text>
    <text x="35" y="66" font-size="11.5" fill="#334155">• <tspan font-weight="600">Đối soát công thức (RecipeItem):</tspan> Khi đặt đơn (POST /api/v1/orders), hệ thống nhân số ly với lượng nguyên liệu định mức và trừ tồn kho trực tiếp trong <tspan font-weight="600">prisma.$transaction</tspan>.</text>
    <text x="35" y="86" font-size="11.5" fill="#334155">• <tspan font-weight="600">Optimistic Locking trên Ingredient:</tspan> Cột version được đặt trên bảng <tspan font-weight="600">Ingredient</tspan>. Nếu 2 đơn đồng thời làm cạn cùng nguyên liệu, giao dịch sau sẽ bị Rollback và trả về HTTP 409 Conflict.</text>
    <text x="35" y="106" font-size="11.5" fill="#334155">• <tspan font-weight="600">Tính giá Server-Authoritative:</tspan> Đơn giá gốc, topping, voucher được tính toán lại 100% tại Business Layer; tạo Order ở trạng thái PENDING trước khi chuyển sang UC-05 (Thanh toán).</text>
  </g>
</svg>
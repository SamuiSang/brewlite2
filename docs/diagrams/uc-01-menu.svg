<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="0 1, 11 6, 0 11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .boundary-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 8; ry: 8; }
      .boundary-title { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-title { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-sub { font-size: 10px; fill: #000000; text-anchor: middle; }
      .uc-ellipse { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
      .uc-title { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .uc-sub { font-size: 9.5px; fill: #000000; text-anchor: middle; }
      .assoc-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .inherit-line { stroke: #000000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-inherit); }
      .dep-line { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow-open); }
      .rel-tag-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; rx: 3; ry: 3; }
      .rel-label { font-size: 9.5px; font-style: italic; font-weight: 600; fill: #000000; text-anchor: middle; }
      .legend-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 5; ry: 5; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #000000; }
      .legend-text { font-size: 10px; fill: #000000; }
    </style>
  </defs>

  <!-- White Canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="560" y="28" class="title">UC-01 - Sơ đồ Use Case: Duyệt Thực đơn, Tìm kiếm, Lọc Danh mục &amp; Xem Chi tiết Món (FR-01, FR-02)</text>

  <!-- System Boundary -->
  <rect x="220" y="48" width="840" height="395" class="boundary-box"/>
  <text x="640" y="70" class="boundary-title">BrewLite - Phân hệ Thực đơn, Lọc danh mục &amp; Chi tiết món (FR-01, FR-02)</text>

  <!-- Left Top Actor: Guest -->
  <g transform="translate(105, 165)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách vãng lai</text>
    <text x="0" y="86" class="actor-sub">(Guest Customer)</text>
  </g>

  <!-- Left Bottom Actor: Authenticated Customer -->
  <g transform="translate(105, 345)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách thành viên</text>
    <text x="0" y="86" class="actor-sub">(Authenticated Customer)</text>
  </g>

  <!-- Generalization: Customer inherits Guest -->
  <line x1="105" y1="305" x2="105" y2="262" class="inherit-line"/>

  <!-- Column 1 Use Cases (x = 415) -->
  <!-- UC-01.1: Browse Menu -->
  <g transform="translate(415, 195)">
    <ellipse cx="0" cy="0" rx="155" ry="28" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-01.1: Xem danh sách thực đơn đồ uống</text>
    <text x="0" y="11" class="uc-sub">(GET /api/v1/products)</text>
  </g>

  <!-- UC-01.4: View Product Detail -->
  <g transform="translate(415, 345)">
    <ellipse cx="0" cy="0" rx="155" ry="28" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-01.4: Xem thông tin chi tiết món</text>
    <text x="0" y="11" class="uc-sub">&amp; Mở Modal tùy biến (GET /api/v1/products/:id)</text>
  </g>

  <!-- Column 2 Use Cases (x = 855) -->
  <!-- UC-01.2: Filter Category (extends UC-01.1) -->
  <g transform="translate(855, 115)">
    <ellipse cx="0" cy="0" rx="165" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-01.2: Lọc đồ uống theo danh mục</text>
    <text x="0" y="11" class="uc-sub">(?category=COFFEE, TEA, FREEZE, PASTRY)</text>
  </g>

  <!-- UC-01.3: Search Keyword (extends UC-01.1) -->
  <g transform="translate(855, 210)">
    <ellipse cx="0" cy="0" rx="165" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-01.3: Tìm kiếm đồ uống theo từ khóa</text>
    <text x="0" y="11" class="uc-sub">(?search=... | Debounce 300ms)</text>
  </g>

  <!-- Included UC: Check Available Stock -->
  <g transform="translate(855, 335)">
    <ellipse cx="0" cy="0" rx="165" ry="28" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">Kiểm tra tồn kho khả dụng theo thời gian thực</text>
    <text x="0" y="11" class="uc-sub">(availableStock từ Ingredient &amp; RecipeItem)</text>
  </g>

  <!-- Solid Association Lines -->
  <line x1="135" y1="165" x2="260" y2="190" class="assoc-line"/>
  <line x1="135" y1="185" x2="270" y2="335" class="assoc-line"/>

  <!-- <<extend>> Relationships (UC-01.2 -> UC-01.1, UC-01.3 -> UC-01.1) -->
  <line x1="690" y1="120" x2="555" y2="178" class="dep-line"/>
  <rect x="572" y="130" width="142" height="17" class="rel-tag-bg"/>
  <text x="643" y="142" class="rel-label">&lt;&lt;extend&gt;&gt; [Chọn danh mục]</text>

  <line x1="690" y1="208" x2="570" y2="198" class="dep-line"/>
  <rect x="576" y="193" width="136" height="17" class="rel-tag-bg"/>
  <text x="644" y="205" class="rel-label">&lt;&lt;extend&gt;&gt; [Nhập từ khóa]</text>

  <!-- <<include>> Relationships (UC-01.1 -> CheckStock, UC-01.4 -> CheckStock) -->
  <line x1="540" y1="212" x2="715" y2="318" class="dep-line"/>
  <rect x="595" y="256" width="66" height="16" class="rel-tag-bg"/>
  <text x="628" y="268" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <line x1="570" y1="345" x2="690" y2="340" class="dep-line"/>
  <rect x="597" y="334" width="66" height="16" class="rel-tag-bg"/>
  <text x="630" y="346" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Legend Box -->
  <rect x="120" y="458" width="880" height="84" class="legend-box"/>
  <text x="138" y="476" class="legend-title">Ghi chú nghiệp vụ Chức năng 1 (Phương Duy - Dev Team | Chuẩn đơn sắc đen-trắng phục vụ in ấn báo cáo LaTeX):</text>
  <text x="138" y="494" class="legend-text">• Khách hàng (Guest &amp; Thành viên) tự do duyệt thực đơn, lọc theo 4 danh mục (COFFEE, TEA, FREEZE, PASTRY) và tìm kiếm có Debounce 300ms.</text>
  <text x="138" y="511" class="legend-text">• Kiểm soát tồn kho nguyên liệu thô: availableStock = min(floor(Ingredient.stockQuantity / RecipeItem.quantityRequired)).</text>
  <text x="138" y="528" class="legend-text">• Chốt chặn tồn kho phía Client: Món có availableStock == 0 tự động mờ 50%, gắn nhãn "Hết hàng (Sold Out)" và khóa (disabled) nút chọn món.</text>
</svg>

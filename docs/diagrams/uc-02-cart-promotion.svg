<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .boundary-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 8; ry: 8; }
      .boundary-title { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-title { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-sub { font-size: 10px; fill: #000000; text-anchor: middle; }
      .uc-ellipse { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
      .uc-title { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .uc-sub { font-size: 9.5px; fill: #000000; text-anchor: middle; }
      .assoc-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .dep-line { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow-open); }
      .rel-tag-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; rx: 3; ry: 3; }
      .rel-label { font-size: 9.5px; font-style: italic; font-weight: 600; fill: #000000; text-anchor: middle; }
      .legend-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 5; ry: 5; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #000000; }
      .legend-text { font-size: 10px; fill: #000000; }
    </style>
  </defs>

  <!-- White Canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="560" y="28" class="title">UC-02 - Sơ đồ Use Case: Tùy biến Đồ uống, Quản lý Giỏ hàng &amp; Áp mã Khuyến mãi (FR-03, FR-09)</text>

  <!-- System Boundary -->
  <rect x="200" y="48" width="880" height="410" class="boundary-box"/>
  <text x="640" y="70" class="boundary-title">BrewLite - Phân hệ Tùy biến Đồ uống, Quản lý Giỏ hàng &amp; Khuyến mãi (FR-03, FR-09)</text>

  <!-- Left Actor: Customer / Guest -->
  <g transform="translate(95, 235)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách hàng</text>
    <text x="0" y="86" class="actor-sub">(Customer / Guest)</text>
  </g>

  <!-- Column 1: Primary Use Cases (x = 345) -->
  <!-- UC-02.1: Customize Drink -->
  <g transform="translate(345, 150)">
    <ellipse cx="0" cy="0" rx="125" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-02.1: Tùy biến đồ uống</text>
    <text x="0" y="11" class="uc-sub">(Size, Topping, Đường, Đá)</text>
  </g>

  <!-- UC-02.2: Manage Cart -->
  <g transform="translate(345, 315)">
    <ellipse cx="0" cy="0" rx="130" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-02.2: Quản lý giỏ hàng</text>
    <text x="0" y="11" class="uc-sub">(Xem giỏ, tăng/giảm SL, xóa món)</text>
  </g>

  <!-- Column 2: Intermediate Use Cases (x = 665) -->
  <!-- Calc Preview Price -->
  <g transform="translate(665, 110)">
    <ellipse cx="0" cy="0" rx="120" ry="25" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Tính giá tạm tính tức thời</text>
    <text x="0" y="11" class="uc-sub">theo tùy chọn (Preview Price)</text>
  </g>

  <!-- Add To Cart -->
  <g transform="translate(665, 195)">
    <ellipse cx="0" cy="0" rx="120" ry="25" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Thêm món vào giỏ hàng</text>
    <text x="0" y="11" class="uc-sub">(Gộp dòng theo itemKey)</text>
  </g>

  <!-- UC-02.3: Apply Promotion -->
  <g transform="translate(665, 315)">
    <ellipse cx="0" cy="0" rx="125" ry="26" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">UC-02.3: Áp dụng mã khuyến mãi</text>
    <text x="0" y="11" class="uc-sub">(Promotion Voucher)</text>
  </g>

  <!-- UC-02.4: Remove Promotion -->
  <g transform="translate(665, 405)">
    <ellipse cx="0" cy="0" rx="120" ry="25" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">UC-02.4: Hủy áp dụng</text>
    <text x="0" y="11" class="uc-sub">mã khuyến mãi</text>
  </g>

  <!-- Column 3: Included Validation Use Cases (x = 950) -->
  <!-- Check Stock -->
  <g transform="translate(950, 235)">
    <ellipse cx="0" cy="0" rx="115" ry="26" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Kiểm tra giới hạn tồn kho</text>
    <text x="0" y="11" class="uc-sub">(sum(qty) &lt;= availableStock)</text>
  </g>

  <!-- Validate Promo -->
  <g transform="translate(950, 315)">
    <ellipse cx="0" cy="0" rx="115" ry="26" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Kiểm tra điều kiện khuyến mãi</text>
    <text x="0" y="11" class="uc-sub">(/promotions/validate)</text>
  </g>

  <!-- Solid Association Lines -->
  <line x1="125" y1="220" x2="220" y2="155" class="assoc-line"/>
  <line x1="125" y1="250" x2="215" y2="315" class="assoc-line"/>

  <!-- Relationships between Column 1 and Column 2 -->
  <!-- UC-02.1 -> CalcPrice (<<include>>) -->
  <line x1="465" y1="138" x2="545" y2="118" class="dep-line"/>
  <rect x="475" y="115" width="62" height="16" class="rel-tag-bg"/>
  <text x="506" y="126" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- AddToCart -> UC-02.1 (<<extend>>) -->
  <line x1="545" y1="188" x2="465" y2="164" class="dep-line"/>
  <rect x="448" y="169" width="128" height="16" class="rel-tag-bg"/>
  <text x="512" y="180" class="rel-label">&lt;&lt;extend&gt;&gt; [Thêm vào giỏ]</text>

  <!-- UC-02.3 -> UC-02.2 (<<extend>>) -->
  <line x1="540" y1="315" x2="475" y2="315" class="dep-line"/>
  <rect x="448" y="294" width="122" height="16" class="rel-tag-bg"/>
  <text x="509" y="305" class="rel-label">&lt;&lt;extend&gt;&gt; [Nhập mã]</text>

  <!-- UC-02.4 -> UC-02.2 (<<extend>>) -->
  <line x1="550" y1="395" x2="455" y2="335" class="dep-line"/>
  <rect x="452" y="362" width="115" height="16" class="rel-tag-bg"/>
  <text x="509.5" y="373" class="rel-label">&lt;&lt;extend&gt;&gt; [Hủy mã]</text>

  <!-- Relationships between Column 1/2 and Column 3 -->
  <!-- AddToCart -> CheckStock (<<include>>) -->
  <line x1="782" y1="205" x2="840" y2="225" class="dep-line"/>
  <rect x="780" y="202" width="62" height="16" class="rel-tag-bg"/>
  <text x="811" y="213" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-02.2 -> CheckStock (<<include>> routed cleanly above UC-02.3 without crossing labels) -->
  <path d="M 465 298 Q 665 255 835 242" class="dep-line"/>
  <rect x="634" y="255" width="62" height="16" class="rel-tag-bg"/>
  <text x="665" y="266" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-02.3 -> ValidatePromo (<<include>>) -->
  <line x1="790" y1="315" x2="835" y2="315" class="dep-line"/>
  <rect x="781" y="295" width="62" height="16" class="rel-tag-bg"/>
  <text x="812" y="306" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Legend Box -->
  <rect x="120" y="476" width="880" height="84" class="legend-box"/>
  <text x="138" y="494" class="legend-title">Ghi chú nghiệp vụ Chức năng 2 (Quỳnh - Dev Team | Chuẩn đơn sắc đen-trắng phục vụ in ấn báo cáo LaTeX):</text>
  <text x="138" y="512" class="legend-text">• Khách hàng tùy biến quy cách đồ uống (Size S/M/L, Topping, Đường/Đá) và xem giá tạm tính tức thời trước khi xác nhận thêm vào giỏ.</text>
  <text x="138" y="529" class="legend-text">• Giỏ hàng Zustand tự động gộp dòng cùng itemKey, lưu bền vững vào localStorage và khống chế số lượng đặt &lt;= availableStock.</text>
  <text x="138" y="546" class="legend-text">• Mã khuyến mãi được thẩm định Read-only qua API POST /api/v1/promotions/validate (kiểm tra hạn dùng, lượt dùng, minOrderValue).</text>
</svg>

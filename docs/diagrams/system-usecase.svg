<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="1140" height="620" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="0 1, 11 6, 0 11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font-size: 16.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .boundary-box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 8; ry: 8; }
      .boundary-title { font-size: 13px; font-weight: 700; fill: #000000; }
      .actor-title { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-sub { font-size: 10px; fill: #000000; text-anchor: middle; }
      .uc-ellipse { fill: #ffffff; stroke: #000000; stroke-width: 1.7; }
      .uc-ellipse-core { fill: #ffffff; stroke: #000000; stroke-width: 2.2; }
      .uc-title { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .uc-sub { font-size: 9.5px; fill: #000000; text-anchor: middle; }
      .assoc-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .inherit-line { stroke: #000000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-inherit); }
      .dep-line { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow-open); }
      .rel-tag-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; rx: 3; ry: 3; }
      .rel-label { font-size: 9.5px; font-style: italic; font-weight: 600; fill: #000000; text-anchor: middle; }
      .legend-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 5; ry: 5; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #000000; }
      .legend-text { font-size: 10px; fill: #000000; }
    </style>
  </defs>

  <!-- White Canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="570" y="28" class="title">Sơ đồ Use Case Tổng quát Toàn hệ thống BrewLite (6 Phân hệ Chức năng UC-01 → UC-06)</text>

  <!-- System Boundary -->
  <rect x="210" y="48" width="720" height="455" class="boundary-box"/>
  <text x="230" y="72" class="boundary-title">Hệ thống Đặt đồ uống Trực tuyến BrewLite (Next.js PWA + NestJS API + PostgreSQL)</text>

  <!-- Left Top Actor: Guest -->
  <g transform="translate(95, 145)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách vãng lai</text>
    <text x="0" y="86" class="actor-sub">(Guest Customer)</text>
  </g>

  <!-- Left Bottom Actor: Authenticated Customer -->
  <g transform="translate(95, 365)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách thành viên</text>
    <text x="0" y="86" class="actor-sub">(Authenticated Customer)</text>
  </g>

  <!-- Generalization: Customer inherits Guest -->
  <line x1="95" y1="320" x2="95" y2="242" class="inherit-line"/>

  <!-- Right Top Actor: Mock Payment Gateway -->
  <g transform="translate(1045, 225)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Cổng Thanh toán Sandbox</text>
    <text x="0" y="86" class="actor-sub">(VNPay / MoMo / VietQR)</text>
  </g>

  <!-- Right Bottom Actor: Staff / Store Manager -->
  <g transform="translate(1045, 395)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Nhân viên Quầy / Quản lý</text>
    <text x="0" y="86" class="actor-sub">(Barista / Store Manager)</text>
  </g>

  <!-- Left Column inside Boundary: UC-01, UC-02, UC-03 (x = 390) -->
  <!-- UC-01 (Duy) -->
  <g transform="translate(390, 120)">
    <ellipse cx="0" cy="0" rx="145" ry="29" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-01: Duyệt Menu, Lọc &amp; Tìm kiếm</text>
    <text x="0" y="11" class="uc-sub">(Duy - FR-01, FR-02 | Tồn kho Ingredient)</text>
  </g>

  <!-- UC-02 (Quỳnh) -->
  <g transform="translate(390, 215)">
    <ellipse cx="0" cy="0" rx="145" ry="29" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-02: Tùy biến Món, Giỏ hàng</text>
    <text x="0" y="11" class="uc-sub">&amp; Áp mã Khuyến mãi (Quỳnh - FR-03, FR-09)</text>
  </g>

  <!-- UC-03 (Hiếu) -->
  <g transform="translate(390, 315)">
    <ellipse cx="0" cy="0" rx="145" ry="29" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03: Đăng ký, Đăng nhập &amp; JWT</text>
    <text x="0" y="11" class="uc-sub">(Hiếu - FR-04 | Bcrypt &amp; GET /health)</text>
  </g>

  <!-- UC-04 (Chiến - Core Checkout Part 1) -->
  <g transform="translate(390, 425)">
    <ellipse cx="0" cy="0" rx="150" ry="31" class="uc-ellipse-core"/>
    <text x="0" y="-5" class="uc-title">UC-04: Đặt đơn &amp; Khóa kho Nguyên liệu</text>
    <text x="0" y="11" class="uc-sub">(Chiến - FR-05 | Trọng tâm: Optimistic Lock)</text>
  </g>

  <!-- Right Column inside Boundary: UC-05, UC-06 (x = 760) -->
  <!-- UC-05 (Quang - Core Checkout Part 2) -->
  <g transform="translate(760, 240)">
    <ellipse cx="0" cy="0" rx="148" ry="31" class="uc-ellipse-core"/>
    <text x="0" y="-5" class="uc-title">UC-05: Thanh toán Sandbox/Webhook</text>
    <text x="0" y="11" class="uc-sub">(Quang - FR-06 | Trọng tâm: Idempotency-Key)</text>
  </g>

  <!-- UC-06 (Sang) -->
  <g transform="translate(760, 410)">
    <ellipse cx="0" cy="0" rx="148" ry="30" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-06: Biên nhận, Lịch sử Đơn hàng,</text>
    <text x="0" y="11" class="uc-sub">Trạng thái &amp; Loyalty (Sang - FR-07, 08, 10)</text>
  </g>

  <!-- Solid Association Lines -->
  <!-- Guest -> UC-01, UC-02, UC-03 -->
  <line x1="125" y1="135" x2="245" y2="120" class="assoc-line"/>
  <line x1="125" y1="150" x2="245" y2="210" class="assoc-line"/>
  <line x1="125" y1="165" x2="245" y2="305" class="assoc-line"/>

  <!-- Customer -> UC-04, UC-05, UC-06 -->
  <line x1="125" y1="375" x2="240" y2="425" class="assoc-line"/>
  <line x1="125" y1="360" x2="620" y2="250" class="assoc-line"/>
  <line x1="125" y1="390" x2="612" y2="415" class="assoc-line"/>

  <!-- Gateway -> UC-05 -->
  <line x1="908" y1="240" x2="1015" y2="230" class="assoc-line"/>

  <!-- Staff -> UC-06 -->
  <line x1="908" y1="410" x2="1015" y2="400" class="assoc-line"/>

  <!-- <<include>> Relationships inside Boundary -->
  <!-- UC-04 -> UC-03 (Requires JWT Auth) -->
  <line x1="390" y1="394" x2="390" y2="344" class="dep-line"/>
  <rect x="400" y="361" width="60" height="15" class="rel-tag-bg"/>
  <text x="430" y="372" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-05 -> UC-04 (Payment requires PENDING Order) -->
  <line x1="645" y1="260" x2="495" y2="402" class="dep-line"/>
  <rect x="545" y="325" width="60" height="15" class="rel-tag-bg"/>
  <text x="575" y="336" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-06 -> UC-05 (Loyalty/Receipt after PAID) -->
  <line x1="760" y1="380" x2="760" y2="271" class="dep-line"/>
  <rect x="770" y="318" width="60" height="15" class="rel-tag-bg"/>
  <text x="800" y="329" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- Legend Box (Monochrome) -->
  <rect x="210" y="518" width="720" height="84" class="legend-box"/>
  <text x="226" y="536" class="legend-title">Bản đồ Phân bổ 6 Module Chức năng Xuyên suốt cho 6 Thành viên (Chuẩn đơn sắc đen-trắng):</text>
  <text x="226" y="554" class="legend-text">• Luồng End-to-End: Xem Menu (UC-01) → Tùy biến &amp; Giỏ hàng (UC-02) → Đăng nhập JWT (UC-03) → Đặt đơn (UC-04) → Thanh toán (UC-05) → Theo dõi &amp; Loyalty (UC-06).</text>
  <text x="226" y="571" class="legend-text">• Cụm Use Case Trọng tâm (Task 1.3): UC-04 (Chiến - Khóa kho nguyên liệu RecipeItem/Ingredient) &amp; UC-05 (Quang - Thanh toán Sandbox Webhook &amp; Idempotency).</text>
  <text x="226" y="588" class="legend-text">• Khách thành viên kế thừa toàn bộ quyền của Khách vãng lai (UC-01, UC-02) và được cấp quyền thực thi các giao dịch bảo mật (UC-04, UC-05, UC-06).</text>
</svg>

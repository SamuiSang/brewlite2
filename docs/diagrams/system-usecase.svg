<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" width="1120" height="770" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="0 1, 11 6, 0 11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font-size: 16.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .boundary-box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 8; ry: 8; }
      .boundary-title { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-title { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-sub { font-size: 10px; fill: #000000; text-anchor: middle; }
      .uc-ellipse { fill: #ffffff; stroke: #000000; stroke-width: 1.7; }
      .uc-ellipse-core { fill: #ffffff; stroke: #000000; stroke-width: 2.2; }
      .uc-title { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .uc-sub { font-size: 9.5px; fill: #000000; text-anchor: middle; }
      .assoc-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .inherit-line { stroke: #000000; stroke-width: 1.5; fill: none; marker-end: url(#arrow-inherit); }
      .dep-line { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow-open); }
      .rel-tag-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; rx: 3; ry: 3; }
      .rel-label { font-size: 9.5px; font-style: italic; font-weight: 600; fill: #000000; text-anchor: middle; }
      .legend-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 5; ry: 5; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #000000; }
      .legend-text { font-size: 10px; fill: #000000; }
    </style>
  </defs>

  <!-- White Canvas -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="560" y="28" class="title">Sơ đồ Use Case Tổng quát Toàn hệ thống BrewLite (6 Phân hệ Chức năng UC-01 → UC-06)</text>

  <!-- System Boundary -->
  <rect x="230" y="46" width="660" height="575" class="boundary-box"/>
  <text x="560" y="70" class="boundary-title">Hệ thống Đặt đồ uống Trực tuyến BrewLite (Next.js PWA + NestJS API + PostgreSQL)</text>

  <!-- Left Top Actor: Guest -->
  <g transform="translate(105, 165)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách vãng lai</text>
    <text x="0" y="86" class="actor-sub">(Guest Customer)</text>
  </g>

  <!-- Left Bottom Actor: Authenticated Customer -->
  <g transform="translate(105, 435)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách thành viên</text>
    <text x="0" y="86" class="actor-sub">(Authenticated Customer)</text>
  </g>

  <!-- Generalization: Customer inherits Guest (Clean hollow triangle arrow, no redundant text box) -->
  <line x1="105" y1="392" x2="105" y2="265" class="inherit-line"/>

  <!-- Right Top Actor: Sandbox Payment Gateway (Moved up to y=335 for generous spacing) -->
  <g transform="translate(1015, 335)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Cổng Thanh toán Sandbox</text>
    <text x="0" y="86" class="actor-sub">(VNPay / MoMo / VietQR)</text>
  </g>

  <!-- Right Bottom Actor: Staff / Store Manager (Moved up to y=495 so label ends at y=581, well above Legend at y=650) -->
  <g transform="translate(1015, 495)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Nhân viên Quầy / Quản lý</text>
    <text x="0" y="86" class="actor-sub">(Barista / Store Manager)</text>
  </g>

  <!-- 6 Use Cases stacked cleanly in a single vertical flow (x = 560) -->
  <!-- UC-01 (Duy) -->
  <g transform="translate(560, 115)">
    <ellipse cx="0" cy="0" rx="195" ry="26" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-01: Duyệt Menu, Lọc danh mục &amp; Tìm kiếm món</text>
    <text x="0" y="10" class="uc-sub">(Duy - FR-01, FR-02 | Kiểm tra tồn kho nguyên liệu Ingredient)</text>
  </g>

  <!-- UC-02 (Quỳnh) -->
  <g transform="translate(560, 195)">
    <ellipse cx="0" cy="0" rx="195" ry="26" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-02: Tùy biến Món (Size/Topping), Giỏ hàng &amp; Voucher</text>
    <text x="0" y="10" class="uc-sub">(Quỳnh - FR-03, FR-09 | Zustand Store &amp; Validate Promotion)</text>
  </g>

  <!-- UC-03 (Hiếu) -->
  <g transform="translate(560, 285)">
    <ellipse cx="0" cy="0" rx="195" ry="26" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-03: Đăng ký, Đăng nhập, Hồ sơ &amp; Xác thực JWT</text>
    <text x="0" y="10" class="uc-sub">(Hiếu - FR-04 | Mã hóa Bcrypt &amp; Giám sát GET /api/v1/health)</text>
  </g>

  <!-- UC-04 (Chiến - Core Checkout Part 1) -->
  <g transform="translate(560, 380)">
    <ellipse cx="0" cy="0" rx="205" ry="28" class="uc-ellipse-core"/>
    <text x="0" y="-4" class="uc-title">UC-04: Khởi tạo Đơn hàng &amp; Khóa kho Nguyên liệu</text>
    <text x="0" y="11" class="uc-sub">(Chiến - FR-05 | Trọng tâm: Tính tiền Business Layer &amp; Optimistic Lock)</text>
  </g>

  <!-- UC-05 (Quang - Core Checkout Part 2) -->
  <g transform="translate(560, 475)">
    <ellipse cx="0" cy="0" rx="205" ry="28" class="uc-ellipse-core"/>
    <text x="0" y="-4" class="uc-title">UC-05: Thanh toán Sandbox/Webhook 2 bước &amp; Idempotency</text>
    <text x="0" y="11" class="uc-sub">(Quang - FR-06 | Trọng tâm: Chống trừ tiền trùng lặp &amp; Hoàn kho)</text>
  </g>

  <!-- UC-06 (Sang) -->
  <g transform="translate(560, 568)">
    <ellipse cx="0" cy="0" rx="195" ry="26" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-06: Biên nhận, Lịch sử Đơn, Trạng thái &amp; Loyalty</text>
    <text x="0" y="10" class="uc-sub">(Sang - FR-07, FR-08, FR-10 | OrderStatusStepper &amp; Điểm thưởng)</text>
  </g>

  <!-- Solid Association Lines -->
  <!-- Guest -> UC-01, UC-02, UC-03 -->
  <line x1="135" y1="150" x2="365" y2="115" class="assoc-line"/>
  <line x1="135" y1="168" x2="365" y2="195" class="assoc-line"/>
  <line x1="135" y1="186" x2="365" y2="280" class="assoc-line"/>

  <!-- Customer -> UC-03, UC-04, UC-05, UC-06 -->
  <line x1="135" y1="415" x2="365" y2="292" class="assoc-line"/>
  <line x1="135" y1="430" x2="355" y2="380" class="assoc-line"/>
  <line x1="135" y1="445" x2="355" y2="475" class="assoc-line"/>
  <line x1="135" y1="460" x2="365" y2="568" class="assoc-line"/>

  <!-- Gateway -> UC-05 (Clean diagonal-free line on the right) -->
  <line x1="765" y1="470" x2="985" y2="350" class="assoc-line"/>

  <!-- Staff -> UC-06 (Clean line on the right) -->
  <line x1="755" y1="565" x2="985" y2="510" class="assoc-line"/>

  <!-- Vertical <<include>> chain between UC-04 -> UC-03, UC-05 -> UC-04, UC-06 -> UC-05 -->
  <line x1="560" y1="352" x2="560" y2="311" class="dep-line"/>
  <rect x="570" y="324" width="115" height="15" class="rel-tag-bg"/>
  <text x="627" y="335" class="rel-label">&lt;&lt;include&gt;&gt; (Xác thực JWT)</text>

  <line x1="560" y1="447" x2="560" y2="408" class="dep-line"/>
  <rect x="570" y="420" width="118" height="15" class="rel-tag-bg"/>
  <text x="629" y="431" class="rel-label">&lt;&lt;include&gt;&gt; (Đơn PENDING)</text>

  <line x1="560" y1="542" x2="560" y2="503" class="dep-line"/>
  <rect x="570" y="515" width="128" height="15" class="rel-tag-bg"/>
  <text x="634" y="526" class="rel-label">&lt;&lt;include&gt;&gt; (Cộng điểm PAID)</text>

  <!-- Legend Box (Placed cleanly at y=650 below the boundary and actors, no overlap anywhere) -->
  <rect x="120" y="650" width="880" height="90" class="legend-box"/>
  <text x="138" y="670" class="legend-title">Bản đồ Phân bổ 6 Module Chức năng Xuyên suốt cho 6 Thành viên (Chuẩn đơn sắc đen-trắng):</text>
  <text x="138" y="689" class="legend-text">• Luồng End-to-End: Xem Menu (UC-01) → Tùy biến &amp; Giỏ hàng (UC-02) → Đăng nhập JWT (UC-03) → Đặt đơn (UC-04) → Thanh toán (UC-05) → Theo dõi &amp; Loyalty (UC-06).</text>
  <text x="138" y="707" class="legend-text">• Cụm Use Case Trọng tâm (Task 1.3): UC-04 (Chiến - Khóa kho nguyên liệu RecipeItem/Ingredient) &amp; UC-05 (Quang - Thanh toán Sandbox Webhook &amp; Idempotency).</text>
  <text x="138" y="725" class="legend-text">• Khách thành viên kế thừa toàn bộ quyền của Khách vãng lai (UC-01, UC-02) và được cấp quyền thực thi các giao dịch bảo mật (UC-04, UC-05, UC-06).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" style="background-color:#ffffff;font-family:Helvetica,'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
    <marker id="diamond-filled" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="11" markerHeight="9" orient="auto">
      <polygon points="1,6 8,1 15,6 8,11" fill="#000000" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="diamond-hollow" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="11" markerHeight="9" orient="auto">
      <polygon points="1,6 8,1 15,6 8,11" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    </marker>
    <style>
      .title { font-size: 14.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .cls-box { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
      .cls-div { stroke: #000000; stroke-width: 1.1; }
      .cls-name { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .cls-item { font-size: 10.8px; fill: #000000; }
      .rel-line { fill: none; stroke: #000000; stroke-width: 1.3; }
      .rel-label { font-size: 10.5px; fill: #000000; text-anchor: middle; }
      .mult-label { font-size: 10.5px; font-weight: 600; fill: #000000; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="28" class="title">SƠ ĐỒ LỚP (CLASS DIAGRAM): CLASS-06 - BIÊN NHẬN, LỊCH SỬ ĐƠN HÀNG &amp; ĐIỂM THƯỞNG LOYALTY</text>
  <path d="M 290 135 L 365 135" class="rel-line" marker-end="url(#arrow-open)"/>
  <text x="328" y="127" class="rel-label">đặt đơn</text>
  <text x="296" y="150" class="mult-label">1</text>
  <text x="340" y="150" class="mult-label">0..*</text>
  <path d="M 620 135 L 695 135" class="rel-line" marker-end="url(#arrow-open)"/>
  <text x="658" y="127" class="rel-label">biên nhận</text>
  <text x="626" y="150" class="mult-label">1</text>
  <text x="668" y="150" class="mult-label">0..1</text>
  <path d="M 165 241 L 165 365" class="rel-line" marker-start="url(#diamond-filled)"/>
  <text x="110" y="308" class="rel-label">sở hữu lịch sử điểm</text>
  <text x="173" y="258" class="mult-label">1</text>
  <text x="173" y="356" class="mult-label">0..*</text>
  <path d="M 435 288 L 435 325 L 320 325 L 320 365" class="rel-line" marker-end="url(#arrow-open)"/>
  <text x="350" y="318" class="rel-label">phát sinh điểm (EARN/REDEEM)</text>
  <text x="442" y="304" class="mult-label">0..1</text>
  <text x="326" y="356" class="mult-label">0..*</text>
  <path d="M 555 288 L 555 325 L 665 325 L 665 365" class="rel-line" marker-start="url(#diamond-filled)"/>
  <text x="635" y="318" class="rel-label">lưu vết tiến trình đơn</text>
  <text x="562" y="304" class="mult-label">1</text>
  <text x="672" y="356" class="mult-label">1..*</text>
  <!-- Class: User -->
  <rect x="45" y="55" width="245" height="180" class="cls-box"/>
  <text x="167.5" y="74" class="cls-name">User</text>
  <line x1="45" y1="83" x2="290" y2="83" class="cls-div"/>
  <text x="53" y="99" class="cls-item">- id: String</text>
  <text x="53" y="115.5" class="cls-item">- email: String</text>
  <text x="53" y="132" class="cls-item">- fullName: String</text>
  <text x="53" y="148.5" class="cls-item">- phone: String</text>
  <text x="53" y="165" class="cls-item">- role: String</text>
  <text x="53" y="181.5" class="cls-item">- loyaltyPoints: int</text>
  <line x1="45" y1="192" x2="290" y2="192" class="cls-div"/>
  <text x="53" y="208" class="cls-item">+ canRedeemPoints(points: int): boolean</text>
  <text x="53" y="224.5" class="cls-item">+ updateLoyaltyBalance(delta: int): void</text>
  <!-- Class: Order -->
  <rect x="365" y="55" width="255" height="229.5" class="cls-box"/>
  <text x="492.5" y="74" class="cls-name">Order</text>
  <line x1="365" y1="83" x2="620" y2="83" class="cls-div"/>
  <text x="373" y="99" class="cls-item">- id: String</text>
  <text x="373" y="115.5" class="cls-item">- orderCode: String</text>
  <text x="373" y="132" class="cls-item">- userId: String</text>
  <text x="373" y="148.5" class="cls-item">- subtotalAmount: double</text>
  <text x="373" y="165" class="cls-item">- discountAmount: double</text>
  <text x="373" y="181.5" class="cls-item">- loyaltyPointsUsed: int</text>
  <text x="373" y="198" class="cls-item">- finalAmount: double</text>
  <text x="373" y="214.5" class="cls-item">- status: String</text>
  <text x="373" y="231" class="cls-item">- createdAt: DateTime</text>
  <line x1="365" y1="241.5" x2="620" y2="241.5" class="cls-div"/>
  <text x="373" y="257.5" class="cls-item">+ isOwnedBy(userId: String): boolean</text>
  <text x="373" y="274" class="cls-item">+ transitionTo(newStatus: String): void</text>
  <!-- Class: Payment -->
  <rect x="695" y="55" width="225" height="213" class="cls-box"/>
  <text x="807.5" y="74" class="cls-name">Payment</text>
  <line x1="695" y1="83" x2="920" y2="83" class="cls-div"/>
  <text x="703" y="99" class="cls-item">- id: String</text>
  <text x="703" y="115.5" class="cls-item">- orderId: String</text>
  <text x="703" y="132" class="cls-item">- idempotencyKey: String</text>
  <text x="703" y="148.5" class="cls-item">- amount: double</text>
  <text x="703" y="165" class="cls-item">- method: String</text>
  <text x="703" y="181.5" class="cls-item">- status: String</text>
  <text x="703" y="198" class="cls-item">- transactionRef: String</text>
  <text x="703" y="214.5" class="cls-item">- paidAt: DateTime</text>
  <line x1="695" y1="225" x2="920" y2="225" class="cls-div"/>
  <text x="703" y="241" class="cls-item">+ markAsSuccess(txRef: String): void</text>
  <text x="703" y="257.5" class="cls-item">+ markAsFailed(reason: String): void</text>
  <!-- Class: LoyaltyTransaction -->
  <rect x="115" y="365" width="295" height="213" class="cls-box"/>
  <text x="262.5" y="384" class="cls-name">LoyaltyTransaction</text>
  <line x1="115" y1="393" x2="410" y2="393" class="cls-div"/>
  <text x="123" y="409" class="cls-item">- id: String</text>
  <text x="123" y="425.5" class="cls-item">- userId: String</text>
  <text x="123" y="442" class="cls-item">- orderId: String</text>
  <text x="123" y="458.5" class="cls-item">- type: String (EARN / REDEEM / REFUND)</text>
  <text x="123" y="475" class="cls-item">- points: int</text>
  <text x="123" y="491.5" class="cls-item">- description: String</text>
  <text x="123" y="508" class="cls-item">- createdAt: DateTime</text>
  <line x1="115" y1="518.5" x2="410" y2="518.5" class="cls-div"/>
  <text x="123" y="534.5" class="cls-item">+ calculateEarnedPoints(finalAmount: double): int</text>
  <text x="123" y="551" class="cls-item">+ validateBalanceBeforeRedeem(balance: int): boolean</text>
  <text x="123" y="567.5" class="cls-item">+ refundPointsOnCancel(orderId: String): void</text>
  <!-- Class: OrderStatusLog -->
  <rect x="545" y="365" width="285" height="196.5" class="cls-box"/>
  <text x="687.5" y="384" class="cls-name">OrderStatusLog</text>
  <line x1="545" y1="393" x2="830" y2="393" class="cls-div"/>
  <text x="553" y="409" class="cls-item">- id: String</text>
  <text x="553" y="425.5" class="cls-item">- orderId: String</text>
  <text x="553" y="442" class="cls-item">- previousStatus: String</text>
  <text x="553" y="458.5" class="cls-item">- newStatus: String</text>
  <text x="553" y="475" class="cls-item">- changedByUserId: String</text>
  <text x="553" y="491.5" class="cls-item">- note: String</text>
  <text x="553" y="508" class="cls-item">- changedAt: DateTime</text>
  <line x1="545" y1="518.5" x2="830" y2="518.5" class="cls-div"/>
  <text x="553" y="534.5" class="cls-item">+ isValidTransition(): boolean</text>
  <text x="553" y="551" class="cls-item">+ getOrderTimeline(orderId: String): OrderStatusLog[]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .boundary-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 8; ry: 8; }
      .boundary-title { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-title { font-size: 11.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .actor-sub { font-size: 10px; fill: #000000; text-anchor: middle; }
      .uc-ellipse { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
      .uc-title { font-size: 11px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .uc-sub { font-size: 9.5px; fill: #000000; text-anchor: middle; }
      .assoc-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .dep-line { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,3; fill: none; marker-end: url(#arrow-open); }
      .rel-tag-bg { fill: #ffffff; stroke: #000000; stroke-width: 0.8; rx: 3; ry: 3; }
      .rel-label { font-size: 9.5px; font-style: italic; font-weight: 600; fill: #000000; text-anchor: middle; }
      .legend-box { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 5; ry: 5; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #000000; }
      .legend-text { font-size: 10px; fill: #000000; }
    </style>
  </defs>

  <!-- White Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="560" y="28" class="title">UC-06 - Sơ đồ Use Case: Biên nhận, Lịch sử Đơn hàng, Theo dõi Trạng thái &amp; Điểm thưởng Loyalty</text>

  <!-- System Boundary -->
  <rect x="200" y="48" width="720" height="395" class="boundary-box"/>
  <text x="560" y="70" class="boundary-title">BrewLite - Phân hệ Biên nhận, Lịch sử Đơn, Trạng thái &amp; Điểm thưởng Loyalty (FR-07, FR-08, FR-10)</text>

  <!-- Left Actor: Khách hàng đã đăng nhập -->
  <g transform="translate(95, 195)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Khách hàng đã đăng nhập</text>
    <text x="0" y="86" class="actor-sub">(Authenticated Customer)</text>
  </g>

  <!-- Right Actor: Nhân viên pha chế / Quản lý -->
  <g transform="translate(1025, 345)">
    <circle cx="0" cy="-24" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="-11" x2="0" y2="24" stroke="#000000" stroke-width="1.8"/>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="-15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="24" x2="15" y2="54" stroke="#000000" stroke-width="1.8"/>
    <text x="0" y="72" class="actor-title">Nhân viên Quầy / Quản lý</text>
    <text x="0" y="86" class="actor-sub">(Barista / Store Manager)</text>
  </g>

  <!-- Column 1 Use Cases (x = 370) -->
  <!-- UC-06.1 -->
  <g transform="translate(370, 125)">
    <ellipse cx="0" cy="0" rx="135" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-06.1: Xem biên nhận điện tử</text>
    <text x="0" y="11" class="uc-sub">&amp; Theo dõi tiến trình đơn (Stepper)</text>
  </g>

  <!-- UC-06.2 -->
  <g transform="translate(370, 220)">
    <ellipse cx="0" cy="0" rx="135" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-06.2: Xem lịch sử đơn hàng</text>
    <text x="0" y="11" class="uc-sub">(GET /api/v1/orders/my-orders)</text>
  </g>

  <!-- UC-06.3 -->
  <g transform="translate(370, 315)">
    <ellipse cx="0" cy="0" rx="135" ry="27" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-06.3: Tra cứu số dư &amp; lịch sử</text>
    <text x="0" y="11" class="uc-sub">điểm thưởng (Loyalty Balance)</text>
  </g>

  <!-- Extended UC: Đổi điểm thưởng (below UC-06.3) -->
  <g transform="translate(370, 402)">
    <ellipse cx="0" cy="0" rx="135" ry="25" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Đổi điểm thưởng giảm giá đơn</text>
    <text x="0" y="11" class="uc-sub">(LoyaltyTransaction: REDEEM)</text>
  </g>

  <!-- Column 2 Use Cases (x = 745) -->
  <!-- Included UC: Kiểm tra quyền sở hữu -->
  <g transform="translate(745, 165)">
    <ellipse cx="0" cy="0" rx="135" ry="26" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Kiểm tra quyền sở hữu đơn hàng</text>
    <text x="0" y="11" class="uc-sub">&amp; Xác thực phiên JWT</text>
  </g>

  <!-- Included UC: Tích lũy điểm tự động -->
  <g transform="translate(745, 265)">
    <ellipse cx="0" cy="0" rx="135" ry="26" class="uc-ellipse"/>
    <text x="0" y="-3" class="uc-title">Tích lũy điểm thưởng tự động</text>
    <text x="0" y="11" class="uc-sub">khi đơn PAID (Loyalty: EARN)</text>
  </g>

  <!-- UC-06.4: Nhân viên cập nhật trạng thái đơn -->
  <g transform="translate(745, 375)">
    <ellipse cx="0" cy="0" rx="140" ry="28" class="uc-ellipse"/>
    <text x="0" y="-4" class="uc-title">UC-06.4: Cập nhật trạng thái đơn</text>
    <text x="0" y="11" class="uc-sub">(PAID → PREPARING → COMPLETED)</text>
  </g>

  <!-- Solid Association Lines (Actors <-> Use Cases) -->
  <line x1="125" y1="180" x2="235" y2="125" class="assoc-line"/>
  <line x1="125" y1="198" x2="235" y2="220" class="assoc-line"/>
  <line x1="125" y1="216" x2="235" y2="315" class="assoc-line"/>
  <line x1="885" y1="375" x2="995" y2="355" class="assoc-line"/>

  <!-- <<include>> Relationships -->
  <!-- UC-06.1 -> Verify Owner -->
  <line x1="505" y1="128" x2="610" y2="155" class="dep-line"/>
  <rect x="528" y="128" width="60" height="15" class="rel-tag-bg"/>
  <text x="558" y="139" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-06.2 -> Verify Owner -->
  <line x1="505" y1="212" x2="610" y2="175" class="dep-line"/>
  <rect x="528" y="186" width="60" height="15" class="rel-tag-bg"/>
  <text x="558" y="197" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- UC-06.1 -> Earn Points -->
  <line x1="490" y1="140" x2="625" y2="252" class="dep-line"/>
  <rect x="535" y="218" width="60" height="15" class="rel-tag-bg"/>
  <text x="565" y="229" class="rel-label">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>> Relationships -->
  <!-- Redeem Points -> UC-06.3 -->
  <line x1="370" y1="377" x2="370" y2="342" class="dep-line"/>
  <rect x="380" y="352" width="58" height="15" class="rel-tag-bg"/>
  <text x="409" y="363" class="rel-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- Legend Box (Widened to 880px so text never overflows the right border) -->
  <rect x="120" y="458" width="880" height="84" class="legend-box"/>
  <text x="138" y="476" class="legend-title">Ghi chú nghiệp vụ Chức năng 6 (Sang - Scrum Master | Chuẩn đơn sắc đen-trắng phục vụ in ấn báo cáo LaTeX):</text>
  <text x="138" y="494" class="legend-text">• Sau khi đơn hàng chuyển sang PAID (UC-05), hệ thống tự động cộng điểm thưởng (EARN: mỗi 10.000đ = +1 điểm) vào LoyaltyTransaction.</text>
  <text x="138" y="511" class="legend-text">• Khách hàng chỉ xem được biên nhận và lịch sử đơn thuộc đúng userId của mình (chống truy cập chéo IDOR → trả về 403 Forbidden).</text>
  <text x="138" y="528" class="legend-text">• Nhân viên pha chế / Quản lý cập nhật tiến trình đơn (PAID → PREPARING → COMPLETED); thanh OrderStatusStepper cập nhật tương ứng.</text>
</svg>

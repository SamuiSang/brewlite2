<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1135" width="1020" height="1135" style="background-color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
    <style>
      .title { font-size: 14.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .lane-header { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .step-box { fill: #ffffff; stroke: #000000; stroke-width: 1.3; rx: 12; ry: 12; }
      .step-text { font-size: 11px; fill: #000000; text-anchor: middle; }
      .diamond { fill: #ffffff; stroke: #000000; stroke-width: 1.3; }
      .guard { font-size: 10px; fill: #000000; }
      .flow { fill: none; stroke: #000000; stroke-width: 1.25; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="510" y="30" class="title">SƠ ĐỒ HOẠT ĐỘNG TỔNG THỂ (TASK 2.1): LUỒNG ĐẶT &amp; THANH TOÁN ĐƠN HÀNG END-TO-END</text>

  <!-- Swimlane Outer Frame & Header -->
  <rect x="25" y="52" width="970" height="1058" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="25" y1="90" x2="995" y2="90" stroke="#000000" stroke-width="1.4"/>
  <text x="170" y="76" class="lane-header">Khách hàng</text>
  <line x1="315" y1="52" x2="315" y2="1110" stroke="#000000" stroke-width="1.4"/>
  <text x="540" y="76" class="lane-header">Hệ thống BrewLite (Next.js UI &amp; NestJS API)</text>
  <line x1="765" y1="52" x2="765" y2="1110" stroke="#000000" stroke-width="1.4"/>
  <text x="880" y="76" class="lane-header">Cổng Thanh toán Sandbox</text>

  <!-- Initial Node & Activity Final Node -->
  <circle cx="55" cy="130" r="10" fill="#000000"/>
  <circle cx="170" cy="1080" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="170" cy="1080" r="7.5" fill="#000000"/>

  <!-- Step Boxes -->
  <rect x="85" y="108" width="195" height="44" class="step-box"/>
  <text x="182.5" y="126" class="step-text">1. Duyệt Menu, lọc danh mục</text>
  <text x="182.5" y="142" class="step-text">&amp; chọn đồ uống (UC-01)</text>

  <rect x="415" y="108" width="250" height="44" class="step-box"/>
  <text x="540" y="126" class="step-text">2. Đối soát công thức RecipeItem</text>
  <text x="540" y="142" class="step-text">&amp; tính tồn kho nguyên liệu Ingredient</text>

  <rect x="355" y="232" width="175" height="44" class="step-box"/>
  <text x="442.5" y="250" class="step-text">3. Gắn nhãn "Sold Out"</text>
  <text x="442.5" y="266" class="step-text">&amp; khóa nút chọn món</text>

  <rect x="60" y="303" width="220" height="44" class="step-box"/>
  <text x="170" y="321" class="step-text">4. Tùy biến Size/Topping, áp mã</text>
  <text x="170" y="337" class="step-text">Promotion &amp; bấm Đặt hàng (UC-02)</text>

  <rect x="60" y="403" width="220" height="44" class="step-box"/>
  <text x="170" y="421" class="step-text">5. Đăng nhập / Đăng ký tài khoản</text>
  <text x="170" y="437" class="step-text">&amp; nhận JWT Token (UC-03)</text>

  <rect x="405" y="498" width="270" height="46" class="step-box"/>
  <text x="540" y="517" class="step-text">6. Mở DB Transaction: Tính lại 100% giá</text>
  <text x="540" y="533" class="step-text">tại Business Layer &amp; Khóa Optimistic Lock</text>

  <rect x="355" y="620" width="175" height="44" class="step-box"/>
  <text x="442.5" y="638" class="step-text">7. Rollback Transaction &amp;</text>
  <text x="442.5" y="654" class="step-text">báo lỗi 409 Hết nguyên liệu</text>

  <rect x="550" y="620" width="185" height="44" class="step-box"/>
  <text x="642.5" y="638" class="step-text">8. Tạo đơn PENDING (TTL 15p)</text>
  <text x="642.5" y="654" class="step-text">&amp; sinh Idempotency-Key</text>

  <rect x="60" y="706" width="220" height="44" class="step-box"/>
  <text x="170" y="724" class="step-text">9. Chọn phương thức thanh toán</text>
  <text x="170" y="740" class="step-text">&amp; bấm Xác nhận tại /checkout</text>

  <rect x="415" y="706" width="250" height="44" class="step-box"/>
  <text x="540" y="724" class="step-text">10. Kiểm tra Idempotency-Key (chống</text>
  <text x="540" y="740" class="step-text">trừ tiền lặp) &amp; Tạo Payment PENDING</text>

  <rect x="777.5" y="705" width="205" height="46" class="step-box"/>
  <text x="880" y="724" class="step-text">11. Hiển thị QR / Cổng Sandbox</text>
  <text x="880" y="740" class="step-text">&amp; Bắn JSON ngầm về Webhook</text>

  <rect x="355" y="860" width="175" height="46" class="step-box"/>
  <text x="442.5" y="879" class="step-text">12. Hủy đơn CANCELLED &amp;</text>
  <text x="442.5" y="895" class="step-text">Hoàn kho nguyên liệu (Restock)</text>

  <rect x="550" y="860" width="185" height="46" class="step-box"/>
  <text x="642.5" y="879" class="step-text">13. Cập nhật Order = PAID &amp;</text>
  <text x="642.5" y="895" class="step-text">Cộng điểm Loyalty (EARN)</text>

  <rect x="410" y="944" width="260" height="44" class="step-box"/>
  <text x="540" y="962" class="step-text">14. Hiển thị Biên nhận / Trạng thái đơn</text>
  <text x="540" y="978" class="step-text">(PAID → PREPARING → COMPLETED)</text>

  <rect x="60" y="944" width="220" height="44" class="step-box"/>
  <text x="170" y="962" class="step-text">15. Quan sát kết quả đơn hàng</text>
  <text x="170" y="978" class="step-text">&amp; nhận đồ uống hoàn tất</text>

  <!-- Decision Diamonds -->
  <polygon points="540,178 557,195 540,212 523,195" class="diamond"/>
  <polygon points="540,308 557,325 540,342 523,325" class="diamond"/>
  <polygon points="540,566 557,583 540,600 523,583" class="diamond"/>
  <polygon points="540,793 557,810 540,827 523,810" class="diamond"/>

  <!-- Merge Diamonds (UML 2.5 Standard Merge Nodes) -->
  <polygon points="540,456 552,468 540,480 528,468" class="diamond"/>
  <polygon points="335,632 345,642 335,652 325,642" class="diamond"/>
  <polygon points="335,873 345,883 335,893 325,883" class="diamond"/>
  <polygon points="170,1018 182,1030 170,1042 158,1030" class="diamond"/>

  <!-- Control Flows -->
  <path d="M 65 130 L 85 130" class="flow"/>
  <path d="M 280 130 L 415 130" class="flow"/>
  <path d="M 540 152 L 540 178" class="flow"/>

  <!-- Decision 1: Stock check -->
  <path d="M 523 195 L 442.5 195 L 442.5 232" class="flow"/>
  <text x="480" y="188" class="guard" text-anchor="middle">[Hết nguyên liệu]</text>
  <path d="M 557 195 L 675 195 L 675 290 L 170 290 L 170 303" class="flow"/>
  <text x="615" y="188" class="guard" text-anchor="middle">[Còn hàng]</text>

  <!-- Step 3 -> Merge Exit 1 -->
  <path d="M 355 254 L 335 254 L 335 632" class="flow"/>

  <!-- Step 4 -> Decision 2 (Auth check) -->
  <path d="M 280 325 L 523 325" class="flow"/>
  <path d="M 540 342 L 540 425 L 280 425" class="flow"/>
  <text x="430" y="418" class="guard" text-anchor="middle">[Chưa đăng nhập]</text>
  <path d="M 557 325 L 685 325 L 685 468 L 552 468" class="flow"/>
  <text x="620" y="318" class="guard" text-anchor="middle">[Đã có JWT]</text>

  <!-- Step 5 -> Merge Auth -> Step 6 -->
  <path d="M 170 447 L 170 468 L 528 468" class="flow"/>
  <path d="M 540 480 L 540 498" class="flow"/>

  <!-- Step 6 -> Decision 3 (OCC Stock Lock) -->
  <path d="M 540 544 L 540 566" class="flow"/>
  <path d="M 523 583 L 442.5 583 L 442.5 620" class="flow"/>
  <text x="455" y="576" class="guard" text-anchor="middle">[Xung đột / Hết kho]</text>
  <path d="M 557 583 L 642.5 583 L 642.5 620" class="flow"/>
  <text x="635" y="576" class="guard" text-anchor="middle">[Đủ kho &amp; Khớp version]</text>

  <!-- Step 7 -> Merge Exit 1 -> Merge Exit 2 -->
  <path d="M 355 642 L 345 642" class="flow"/>
  <path d="M 335 652 L 335 873" class="flow"/>

  <!-- Step 8 -> Step 9 -> Step 10 -> Step 11 -->
  <path d="M 642.5 664 L 642.5 686 L 170 686 L 170 706" class="flow"/>
  <path d="M 280 728 L 415 728" class="flow"/>
  <path d="M 665 728 L 777.5 728" class="flow"/>

  <!-- Step 11 -> Decision 4 (Webhook top entry) -->
  <path d="M 880 751 L 880 773 L 540 773 L 540 793" class="flow"/>
  <text x="685" y="766" class="guard" text-anchor="middle">[Webhook JSON Callback]</text>

  <!-- Decision 4 branches -->
  <path d="M 523 810 L 442.5 810 L 442.5 860" class="flow"/>
  <text x="440" y="803" class="guard" text-anchor="middle">[FAILED / Quá hạn TTL]</text>
  <path d="M 557 810 L 642.5 810 L 642.5 860" class="flow"/>
  <text x="612" y="803" class="guard" text-anchor="middle">[SUCCESS]</text>

  <!-- Step 12 (Cancelled) -> Merge Exit 2 -> Merge Final -->
  <path d="M 355 883 L 345 883" class="flow"/>
  <path d="M 335 893 L 335 1030 L 182 1030" class="flow"/>

  <!-- Step 13 (PAID) -> Step 14 -> Step 15 -> Merge Final -> Stop -->
  <path d="M 642.5 906 L 642.5 925 L 540 925 L 540 944" class="flow"/>
  <path d="M 410 966 L 280 966" class="flow"/>
  <path d="M 170 988 L 170 1018" class="flow"/>
  <path d="M 170 1042 L 170 1068" class="flow"/>
</svg>

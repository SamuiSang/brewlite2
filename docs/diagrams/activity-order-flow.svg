<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1080" width="980" height="1080" style="background-color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
    <style>
      .title { font-size: 14.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .lane-header { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; }
      .step-box { fill: #ffffff; stroke: #000000; stroke-width: 1.3; rx: 12; ry: 12; }
      .step-text { font-size: 11px; fill: #000000; text-anchor: middle; }
      .diamond { fill: #ffffff; stroke: #000000; stroke-width: 1.3; }
      .guard { font-size: 10px; fill: #000000; }
      .flow { fill: none; stroke: #000000; stroke-width: 1.25; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="490" y="30" class="title">SƠ ĐỒ HOẠT ĐỘNG TỔNG THỂ (TASK 2.1): LUỒNG ĐẶT &amp; THANH TOÁN ĐƠN HÀNG END-TO-END</text>

  <!-- Swimlane Outer Frame & Header -->
  <rect x="25" y="52" width="930" height="1004" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="25" y1="90" x2="955" y2="90" stroke="#000000" stroke-width="1.4"/>
  <text x="175" y="76" class="lane-header">Khách hàng</text>
  <line x1="325" y1="52" x2="325" y2="1056" stroke="#000000" stroke-width="1.4"/>
  <text x="520" y="76" class="lane-header">Hệ thống BrewLite (Next.js UI &amp; NestJS API)</text>
  <line x1="715" y1="52" x2="715" y2="1056" stroke="#000000" stroke-width="1.4"/>
  <text x="835" y="76" class="lane-header">Cổng Thanh toán Sandbox</text>
  <circle cx="65" cy="130" r="11" fill="#000000"/>
  <circle cx="175" cy="1025" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <circle cx="175" cy="1025" r="7.5" fill="#000000"/>
  <rect x="87.5" y="108" width="195" height="44" class="step-box"/>
  <text x="185" y="126" class="step-text">1. Duyệt Menu, lọc danh mục</text>
  <text x="185" y="142" class="step-text">&amp; chọn đồ uống (UC-01)</text>
  <rect x="395" y="108" width="250" height="44" class="step-box"/>
  <text x="520" y="126" class="step-text">2. Đối soát công thức RecipeItem</text>
  <text x="520" y="142" class="step-text">&amp; tính tồn kho nguyên liệu Ingredient</text>
  <rect x="342.5" y="233" width="185" height="44" class="step-box"/>
  <text x="435" y="251" class="step-text">3. Gắn nhãn "Sold Out"</text>
  <text x="435" y="267" class="step-text">&amp; khóa nút chọn món</text>
  <rect x="65" y="303" width="220" height="44" class="step-box"/>
  <text x="175" y="321" class="step-text">4. Tùy biến Size/Topping, áp mã</text>
  <text x="175" y="337" class="step-text">Promotion &amp; bấm Đặt hàng (UC-02)</text>
  <rect x="65" y="403" width="220" height="44" class="step-box"/>
  <text x="175" y="421" class="step-text">5. Đăng nhập / Đăng ký tài khoản</text>
  <text x="175" y="437" class="step-text">&amp; nhận JWT Token (UC-03)</text>
  <rect x="385" y="472" width="270" height="46" class="step-box"/>
  <text x="520" y="491" class="step-text">6. Mở DB Transaction: Tính lại 100% giá</text>
  <text x="520" y="507" class="step-text">tại Business Layer &amp; Khóa Optimistic Lock</text>
  <rect x="342.5" y="603" width="185" height="44" class="step-box"/>
  <text x="435" y="621" class="step-text">7. Rollback Transaction &amp;</text>
  <text x="435" y="637" class="step-text">báo lỗi 409 Hết nguyên liệu</text>
  <rect x="522.5" y="603" width="185" height="44" class="step-box"/>
  <text x="615" y="621" class="step-text">8. Tạo đơn PENDING (TTL 15p)</text>
  <text x="615" y="637" class="step-text">&amp; sinh Idempotency-Key</text>
  <rect x="65" y="693" width="220" height="44" class="step-box"/>
  <text x="175" y="711" class="step-text">9. Chọn phương thức thanh toán</text>
  <text x="175" y="727" class="step-text">&amp; bấm Xác nhận tại /checkout</text>
  <rect x="395" y="693" width="250" height="44" class="step-box"/>
  <text x="520" y="711" class="step-text">10. Kiểm tra Idempotency-Key (chống</text>
  <text x="520" y="727" class="step-text">trừ tiền lặp) &amp; Tạo Payment PENDING</text>
  <rect x="732.5" y="692" width="205" height="46" class="step-box"/>
  <text x="835" y="711" class="step-text">11. Hiển thị QR / Cổng Sandbox</text>
  <text x="835" y="727" class="step-text">&amp; Bắn JSON ngầm về Webhook</text>
  <rect x="342.5" y="852" width="185" height="46" class="step-box"/>
  <text x="435" y="871" class="step-text">12. Hủy đơn CANCELLED &amp;</text>
  <text x="435" y="887" class="step-text">Hoàn kho nguyên liệu (Restock)</text>
  <rect x="522.5" y="852" width="185" height="46" class="step-box"/>
  <text x="615" y="871" class="step-text">13. Cập nhật Order = PAID &amp;</text>
  <text x="615" y="887" class="step-text">Cộng điểm Loyalty (EARN)</text>
  <rect x="390" y="938" width="260" height="44" class="step-box"/>
  <text x="520" y="956" class="step-text">14. Hiển thị Biên nhận / Trạng thái đơn</text>
  <text x="520" y="972" class="step-text">(PAID → PREPARING → COMPLETED)</text>
  <rect x="65" y="938" width="220" height="44" class="step-box"/>
  <text x="175" y="956" class="step-text">15. Quan sát kết quả đơn hàng</text>
  <text x="175" y="972" class="step-text">&amp; nhận đồ uống hoàn tất</text>
  <polygon points="520,178 537,195 520,212 503,195" class="diamond"/>
  <polygon points="520,308 537,325 520,342 503,325" class="diamond"/>
  <polygon points="520,543 537,560 520,577 503,560" class="diamond"/>
  <polygon points="520,783 537,800 520,817 503,800" class="diamond"/>
  <path d="M 76 130 L 87 130" class="flow"/>
  <path d="M 283 130 L 395 130" class="flow"/>
  <path d="M 520 152 L 520 178" class="flow"/>
  <path d="M 503 195 L 435 195 L 435 233" class="flow"/>
  <text x="462" y="188" class="guard" text-anchor="middle">[Hết nguyên liệu]</text>
  <path d="M 537 195 L 665 195 L 665 290 L 175 290 L 175 303" class="flow"/>
  <text x="585" y="188" class="guard" text-anchor="middle">[Còn hàng]</text>
  <path d="M 342 255 L 336 255 L 336 1025 L 187 1025" class="flow"/>
  <path d="M 285 325 L 503 325" class="flow"/>
  <path d="M 520 342 L 520 425 L 285 425" class="flow"/>
  <text x="435" y="418" class="guard" text-anchor="middle">[Chưa đăng nhập]</text>
  <path d="M 537 325 L 685 325 L 685 495 L 655 495" class="flow"/>
  <text x="610" y="318" class="guard" text-anchor="middle">[Đã có JWT]</text>
  <path d="M 175 447 L 175 495 L 385 495" class="flow"/>
  <path d="M 520 518 L 520 543" class="flow"/>
  <path d="M 503 560 L 435 560 L 435 603" class="flow"/>
  <text x="448" y="553" class="guard" text-anchor="middle">[Xung đột / Hết kho]</text>
  <path d="M 537 560 L 615 560 L 615 603" class="flow"/>
  <text x="615" y="553" class="guard" text-anchor="middle">[Đủ kho &amp; Khớp version]</text>
  <path d="M 342 625 L 336 625" class="flow"/>
  <path d="M 615 647 L 615 672 L 175 672 L 175 693" class="flow"/>
  <path d="M 285 715 L 395 715" class="flow"/>
  <path d="M 645 715 L 732 715" class="flow"/>
  <path d="M 835 738 L 835 800 L 537 800" class="flow"/>
  <text x="760" y="792" class="guard" text-anchor="middle">[Webhook JSON Callback]</text>
  <path d="M 503 800 L 435 800 L 435 852" class="flow"/>
  <text x="445" y="842" class="guard" text-anchor="middle">[FAILED / Quá hạn TTL]</text>
  <path d="M 520 817 L 615 817 L 615 852" class="flow"/>
  <text x="575" y="812" class="guard" text-anchor="middle">[SUCCESS]</text>
  <path d="M 435 898 L 435 922 L 520 922 L 520 938" class="flow"/>
  <path d="M 615 898 L 615 922 L 520 922" class="flow"/>
  <path d="M 390 960 L 285 960" class="flow"/>
  <path d="M 175 982 L 175 1013" class="flow"/>
</svg>
